[project]
name = "nonebot-plugin-fishpersona"
version = "0.1.0"
description = "多套人设：registry + 每角色文案库（缺就中立兜底，绝不串词）+ 会话绑定（nonebot2，零 LLM 开销）"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "173ababah" }]
keywords = ["nonebot2", "nonebot-plugin", "persona", "prompt", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: Nonebot2",
  "License :: OSI Approved :: MIT License",
]
dependencies = ["nonebot2>=2.0.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/173ababah/nonebot-plugin-fishpersona"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true
